<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Produce catalogue · Mann Farm Fresh</title>
    <meta
      name="description"
      content="94 vegetables, herbs and fruit for kitchens and stores in Chandigarh Tricity, Punjab and Delhi NCR. Add quantities and send one quote."
    />
    <meta name="theme-color" content="#1F4A35" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/core.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/components/site-header.js"></script>
    <script src="js/components/site-menu.js"></script>
    <script src="js/components/site-footer.js"></script>
  </head>
  <body data-page="products">
    <a class="skip" href="#main">Skip to content</a>

    <site-header></site-header>

    <site-menu></site-menu>

    <main id="main" class="inner">
      <section class="page-top">
        <div class="wrap">
          <nav class="crumbs" aria-label="Breadcrumb">
            <a href="index.html">Home</a>
            <span aria-hidden="true">/</span>
            <span>Products</span>
          </nav>
          <h1>Produce catalogue</h1>
          <p class="lead">
            94 vegetables, herbs and fruit. Add what you buy with a quantity, then send it as one quote. We confirm
            price, grade and delivery.
          </p>
        </div>
      </section>
      <section class="flush">
        <div class="wrap cat-page">
          <nav class="pk-side" id="catSide" aria-label="Product categories"></nav>
          <div>
            <div class="cat-tools">
              <div class="search">
                <mann-icon name="search"></mann-icon>
                <input
                  id="catSearch"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Search tamatar, bhindi, mushroom…"
                  aria-label="Search products"
                />
              </div>
              <p class="cat-count" id="catCount" aria-live="polite"></p>
            </div>
            <div class="pgrid" id="catalogue"></div>
          </div>
        </div>
      </section>
      <order-band></order-band>
    </main>

    <site-footer></site-footer>
    <basket-button></basket-button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js" defer></script>
    <script src="js/motion.js" defer></script>
    <script src="js/data.js"></script>
    <script src="js/components/photo-loader.js"></script>
    <script src="js/components/basket-button.js"></script>
    <script src="js/components/order-band.js"></script>
    <script src="js/components/qty-stepper.js"></script>
    <script src="js/components/catalogue-filter.js"></script>
    <script src="js/components/product-card.js"></script>
    <script src="js/pages/catalogue.js"></script>
  </body>
</html>
